services:

  db:
    image: postgres:18
    container_name: anganai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anganai
    ports:
      - "5432:5432"
    volumes:
      - anganai_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anganai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: 655840552972.dkr.ecr.eu-north-1.amazonaws.com/anganai-backend:latest
    
    container_name: anganai-backend
    restart: unless-stopped
    env_file:
      - /home/ubuntu/anganai/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/anganai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  anganai_postgres_data: