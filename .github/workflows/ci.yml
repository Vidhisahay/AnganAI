name: AnganAI CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m compileall backend

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: anganai-backend
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:latest \
            -t $REGISTRY/$REPOSITORY:${{ github.sha }} \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: anganai-backend
        run: |
          docker push $REGISTRY/$REPOSITORY:latest
          docker push $REGISTRY/$REPOSITORY:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: self-hosted
    needs:
      - docker

    steps:
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | \
          docker login \
            --username AWS \
            --password-stdin 655840552972.dkr.ecr.eu-north-1.amazonaws.com

      - name: Pull latest backend image
        run: |
          docker pull \
            655840552972.dkr.ecr.eu-north-1.amazonaws.com/anganai-backend:latest

      - name: Stop existing backend container
        run: |
          docker stop anganai-backend || true
          docker rm anganai-backend || true

      - name: Run latest backend
        run: |
          docker run -d \
            --name anganai-backend \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file /home/ubuntu/anganai/.env \
            655840552972.dkr.ecr.eu-north-1.amazonaws.com/anganai-backend:latest

      - name: Verify deployment
        run: |
          sleep 5
          curl --fail http://localhost:8000/health